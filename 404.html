<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Lunaris Documentation</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#6d4aff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
  <!--
    Self-contained on purpose: GitHub Pages serves this file for ANY missing
    path (e.g. /docs/old-page.html), so external stylesheets and images could
    not be resolved with a single relative prefix.
  -->
  <style>
    :root {
      --violet: #6d4aff;
      --violet-dark: #5534df;
      --violet-soft: #eeeaff;
      --ink: #17132b;
      --muted: #716c80;
      --background: #fbfaff;
      --border: #e9e5f5;
      --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(circle at 50% 30%, rgba(109, 74, 255, 0.1), transparent 32rem), var(--background);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }

    .site-header {
      height: 64px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(251, 250, 255, 0.85);
      backdrop-filter: blur(14px);
    }
    .site-header__inner {
      width: min(1400px, calc(100% - 32px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { display: inline-flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .brand .mark {
      width: 26px; height: 26px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #9c86ff, var(--violet) 65%, var(--violet-dark));
      box-shadow: 0 4px 12px rgba(109, 74, 255, 0.35);
    }
    .brand em { font-style: normal; color: var(--violet); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 40px; padding: 0 16px; border-radius: 11px;
      font-size: 14px; font-weight: 700; transition: 180ms ease;
    }
    .btn-primary { color: #fff; background: var(--violet); box-shadow: 0 8px 20px rgba(109, 74, 255, 0.2); }
    .btn-primary:hover { background: var(--violet-dark); transform: translateY(-2px); }
    .btn-secondary { color: #514c60; border: 1px solid var(--border); background: #fff; }
    .btn-secondary:hover { border-color: #d8d0f4; color: var(--violet-dark); background: var(--violet-soft); transform: translateY(-2px); }

    .lost {
      min-height: calc(100vh - 64px);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 40px 20px;
    }
    .lost__inner { max-width: 540px; }
    .lost__code {
      font-size: clamp(72px, 16vw, 132px);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 1;
      color: var(--violet);
    }
    .lost h1 { margin: 14px 0 0; font-size: clamp(24px, 4vw, 32px); letter-spacing: -0.03em; }
    .lost p { color: var(--muted); margin: 14px 0 22px; line-height: 1.6; }
    .lost code {
      display: inline-block; padding: 3px 9px;
      border: 1px solid var(--border); border-radius: 7px;
      background: var(--violet-soft); color: var(--violet-dark);
      font-family: var(--font-mono); font-size: 13px; word-break: break-all;
    }
    .actions { margin-top: 26px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    footer { padding: 26px 20px; text-align: center; color: #9a94a8; font-size: 12.5px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" id="homeLink" href="./">
        <span class="mark" aria-hidden="true"></span>
        <span>Lunaris<em>.</em></span>
      </a>
      <a class="btn btn-primary" id="docsLink" href="docs/">Back to Docs</a>
    </div>
  </header>

  <main class="lost">
    <div class="lost__inner">
      <div class="lost__code">404</div>
      <h1>This page drifted out of orbit</h1>
      <p>The documentation page you were looking for doesn’t exist — it may have been renamed or moved.</p>
      <code id="wanted"></code>
      <div class="actions">
        <a class="btn btn-primary" id="homeBtn" href="./">Go home</a>
        <a class="btn btn-secondary" id="docsBtn" href="docs/">Documentation</a>
      </div>
    </div>
  </main>

  <footer>© 2026 Lunaris · MIT License</footer>

  <script>
    // Derive the site base from the original URL so links work on project
    // sites (user.github.io/repo/) as well as on user sites. Anything under
    // /docs/ is unambiguous; otherwise probe the first path segment.
    function deriveBase() {
      var path = location.pathname;
      var i = path.indexOf("/docs/");
      if (i !== -1) return Promise.resolve(path.slice(0, i + 1));

      var seg = path.split("/")[1];
      var candidates = ["/"];
      if (seg && seg.indexOf(".") === -1) candidates.push("/" + seg + "/");

      return candidates.reduce(function (chain, base) {
        return chain.then(function (found) {
          if (found) return found;
          return fetch(base + "assets/css/style.css", { method: "HEAD" })
            .then(function (r) { return r.ok ? base : null; })
            .catch(function () { return null; });
        });
      }, Promise.resolve(null)).then(function (base) { return base || "/"; });
    }

    deriveBase().then(function (base) {
      ["homeLink", "homeBtn"].forEach(function (id) {
        document.getElementById(id).setAttribute("href", base);
      });
      ["docsLink", "docsBtn"].forEach(function (id) {
        document.getElementById(id).setAttribute("href", base + "docs/");
      });
      document.getElementById("wanted").textContent = location.pathname;

      var icon = document.createElement("link");
      icon.rel = "icon";
      icon.type = "image/png";
      icon.href = base + "assets/img/logo.png";
      document.head.appendChild(icon);
    });
  </script>
</body>
</html>
